name: rwb-marketplace

x-database-environment: &database-environment
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: marketplace
  PGUSER: hack
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set a random POSTGRES_PASSWORD in deploy/.env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m
    shm_size: 128mb
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: hack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles: ["cli"]
    build:
      context: ..
    environment: *database-environment
    volumes:
      - ../:/app
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ..
    networks:
      default:
        aliases: [rwb-marketplace-api]
    entrypoint: ["uvicorn"]
    command: ["backend.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    restart: unless-stopped
    mem_limit: 768m
    environment: *database-environment
    volumes:
      - ../:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    mem_limit: 64m
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    profiles: ["standalone"]
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
      APP_IP: ${APP_IP:?Set APP_IP in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
