services:
  # База данных. Наружу открыта только на этой машине: 127.0.0.1:5433
  # (5433, чтобы не мешать базе организаторов на 5432).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # По умолчанию Docker даёт 64 МБ /dev/shm, тяжёлым запросам PostgreSQL этого мало.
    shm_size: 256mb
    environment:
      POSTGRES_USER: hack
      POSTGRES_PASSWORD: hack
      POSTGRES_DB: marketplace
      # ускоряет инициализацию, для учебной базы безопасно
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL-скрипты отсюда выполняются один раз при первом старте
      - ./scripts/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Проект: Python, зависимости и psql. Все команды — через run.py:
  #   docker compose run --rm app build
  # Репозиторий монтируется в /app, поэтому правки видны без пересборки образа,
  # а результаты (data/, artifacts/) появляются в папке проекта.
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Внутри сети Docker база доступна по имени сервиса и своему порту 5432.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: hack
      PGPASSWORD: hack
    volumes:
      - .:/app

  # Служебная БД Metabase хранит пользователей, подключения и дашборды.
  metabase-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase_local
      POSTGRES_DB: metabase
    volumes:
      - metabase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: metabase_local
    depends_on:
      postgres:
        condition: service_healthy
      metabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20

  # Веб-клиент на случай, если DBeaver поставить не получится.
  # По умолчанию НЕ запускается: образ весит около 400 МБ, и если его
  # тянуть при первом старте, кажется, что всё зависло.
  # Запуск при необходимости:  docker compose --profile tools up -d
  # В pgAdmin сервер регистрируется с хостом postgres и портом 5432.
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: hack@local.dev
      PGADMIN_DEFAULT_PASSWORD: hack
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  metabase_pgdata:
